    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in iframe preview
      if (typeof window !== 'undefined') {
        const originalConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('WebSocket') || msg.includes('failed to connect to websocket') || msg.includes('closed without opened')) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('failed to connect to websocket') || e.message.includes('closed without opened'))) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason?.message || String(e.reason || '');
          if (reason.includes('WebSocket') || reason.includes('closed without opened')) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      }
    </script>
